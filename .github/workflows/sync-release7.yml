name: Stage encrypted release 7 objects
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage immutable npm ciphertext without switching bootstrap
        env:
          RELEASE_VERSION: 0.0.0-raba616459ef5c2f130f7b12cacfadfb06d791d69
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = "0.0.0-raba616459ef5c2f130f7b12cacfadfb06d791d69"
          rm -rf /tmp/wc-release && mkdir -p /tmp/wc-release
          curl --fail --location --retry 3 --output /tmp/wc-release.tgz "https://registry.npmjs.org/@cml227/wenanchen-content/-/wenanchen-content-${RELEASE_VERSION}.tgz"
          tar -xzf /tmp/wc-release.tgz -C /tmp/wc-release
          test "$(find /tmp/wc-release/package/payload -type f | wc -l)" = "7739"
          node -e 'const b=require("/tmp/wc-release/package/payload/_lph/bootstrap.json");if(b.releaseId!=="aba616459ef5c2f130f7b12cacfadfb06d791d695a450b54a9b0baf8a027b3d2"||b.sequence!==7||b.fileCount!==3868)throw new Error("release identity mismatch")'
          rsync -a --exclude="_lph/bootstrap.json" /tmp/wc-release/package/payload/ ./
          test -f .nojekyll
          git diff --exit-code -- _lph/bootstrap.json
          git config user.name "Local Publish Hub"
          git config user.email "local-publish-hub@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Objects already staged"; exit 0; fi
          git commit -m "Stage encrypted release 7 objects"
          git push origin main
